<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전자결재 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('approval')}"></div>

    <main class="main">
        <div class="topline">
            <div>
                <h1>전자결재</h1>
                <p class="page-sub">휴가·지출·구매 등 결재 요청을 관리합니다.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/approval/new}">+ 결재 요청 작성</a>
        </div>

        <div class="panel">
            <div class="rows">
                <a class="row" th:each="r : ${requests}" th:href="@{/approval/{id}(id=${r.id})}">
                    <span class="badge" th:text="${r.type}">구분</span>
                    <span class="title" th:text="${r.title}">제목</span>
                    <span class="meta" th:text="${r.requester.displayName}">기안자</span>
                    <span class="meta num" th:text="${#temporals.format(r.createdAt, 'yyyy.MM.dd')}">작성일</span>
                    <span class="status-pill"
                          th:classappend="${r.status.name().toLowerCase()}"
                          th:text="${r.status}">상태</span>
                </a>
                <div class="empty-note" th:if="${#lists.isEmpty(requests)}">등록된 결재 요청이 없습니다.</div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
