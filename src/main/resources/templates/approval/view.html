<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${req.title}">결재 요청</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('approval')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/approval}">전자결재</a><span class="sep">/</span><span th:text="${req.title}">제목</span></div>

        <div class="topline">
            <h1 th:text="${req.title}">제목</h1>
            <span class="status-pill" th:classappend="${req.status.name().toLowerCase()}" th:text="${req.status}">상태</span>
        </div>
        <p class="meta-line">
            <span th:text="${req.type}">구분</span>
            <b th:text="${req.requester.displayName}">기안자</b>
        </p>

        <div class="panel">
            <div class="panel-body content-body" th:text="${req.content}">내용</div>
        </div>

        <div class="panel" th:if="${req.status.name() == 'APPROVED' or req.status.name() == 'REJECTED'}">
            <div class="panel-body">
                <p class="meta-line" style="margin:0 0 8px;">
                    <span>처리자 <b th:text="${req.approver != null ? req.approver.displayName : ''}"></b></span>
                    <span th:text="${req.decidedAt != null ? #temporals.format(req.decidedAt, 'yyyy.MM.dd HH:mm') : ''}"></span>
                </p>
                <p th:if="${req.approverComment != null and !req.approverComment.isEmpty()}" style="margin:0;" th:text="${req.approverComment}">코멘트</p>
            </div>
        </div>

        <div class="btn-row" th:if="${isOwner and req.status.name() == 'DRAFT'}">
            <form class="inline" th:action="@{/approval/{id}/submit(id=${req.id})}" method="post">
                <button type="submit" class="btn btn-primary">제출</button>
            </form>
            <form class="inline" th:action="@{/approval/{id}/delete(id=${req.id})}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');">
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>

        <div class="panel" th:if="${isAdmin and req.status.name() == 'SUBMITTED'}">
            <div class="panel-body">
                <form th:action="@{/approval/{id}/approve(id=${req.id})}" method="post" class="field">
                    <label>승인 코멘트 (선택)</label>
                    <textarea name="comment" rows="2"></textarea>
                    <div class="btn-row"><button type="submit" class="btn btn-primary">승인</button></div>
                </form>
                <form th:action="@{/approval/{id}/reject(id=${req.id})}" method="post" class="field" style="margin-top:14px;">
                    <label>반려 사유 (선택)</label>
                    <textarea name="comment" rows="2"></textarea>
                    <div class="btn-row"><button type="submit" class="btn btn-danger">반려</button></div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
