<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
      맨 위 왼쪽 로고 공용 조각. 나중에 위치/크기/기능(클릭 시 홈 이동 등)을
      조정할 때 이 파일 하나만 고치면 모든 페이지에 반영된다.
    -->
    <div th:fragment="logo">
        <a th:href="@{/}">
            <img th:src="@{/img/logo.png}" alt="한국미래안전" style="height:44px; width:auto;" />
        </a>
    </div>
</body>
</html>
