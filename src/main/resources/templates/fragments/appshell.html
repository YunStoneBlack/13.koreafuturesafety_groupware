<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><link rel="stylesheet" th:href="@{/css/app.css}" /></head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <div class="brand">
        <img th:src="@{/img/logo-white.png}" alt="한국미래안전" />
    </div>

    <div class="nav-label">그룹웨어</div>
    <nav class="nav">
        <a class="nav-item" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 10 3l7 6.5"/><path d="M4.5 8.5V17h11V8.5"/></svg>
            홈
        </a>
        <a class="nav-item" th:classappend="${active == 'board'} ? 'active'" th:href="@{/board}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.7" width="12" height="14.6" rx="1.4"/><path d="M7 7h6M7 10h6M7 13h3.5"/></svg>
            공지사항
        </a>
        <a class="nav-item" th:classappend="${active == 'approval'} ? 'active'" th:href="@{/approval}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M7 10.2 9 12.3 13.2 8"/></svg>
            전자결재
        </a>
        <a class="nav-item" th:classappend="${active == 'calendar'} ? 'active'" th:href="@{/calendar}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12.5" rx="1.4"/><path d="M3 7.7h14M7 2.7v3M13 2.7v3"/></svg>
            일정공유
        </a>
        <a class="nav-item" th:classappend="${active == 'staff'} ? 'active'" th:href="@{/staff}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.2" cy="6.8" r="2.6"/><path d="M2.5 17c0-2.9 2.1-4.7 4.7-4.7s4.7 1.8 4.7 4.7"/><circle cx="14.3" cy="7.3" r="2.1"/><path d="M12.7 12.7c1.9.2 3.5 1.8 3.5 4.3"/></svg>
            직원정보
        </a>
        <a class="nav-item muted" th:classappend="${active == 'report'} ? 'active'" th:href="@{/report}">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V9.5L10 6l7 3.5V15"/><path d="M7.5 15v-4h5v4"/></svg>
            보고서 자동화
            <span class="pill-soon">준비중</span>
        </a>
    </nav>

    <div sec:authorize="hasRole('ADMIN')">
        <div class="nav-label">관리</div>
        <nav class="nav">
            <a class="nav-item" th:classappend="${active == 'admin'} ? 'active'" th:href="@{/admin}">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 16.5 5v4.8c0 4-2.8 6.6-6.5 7.7-3.7-1.1-6.5-3.7-6.5-7.7V5L10 2.5Z"/><path d="M7.3 10 9.2 11.8 12.9 7.9"/></svg>
                관리자 메뉴
            </a>
        </nav>
    </div>

    <div class="sidebar-foot">
        <div class="avatar" th:text="${currentUser != null ? #strings.substring(currentUser.displayName,0,1) : '?'}">?</div>
        <div>
            <div class="who" th:text="${currentUser != null ? currentUser.displayName : ''}">이름</div>
            <div class="role" th:text="${currentUser != null ? currentUser.role : ''}">ROLE</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">로그아웃</button>
        </form>
    </div>
</aside>
</body>
</html>
