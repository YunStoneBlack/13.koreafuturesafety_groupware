<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
    <title>한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('home')}"></div>

    <!-- 홈 = 보고서 자동화·서류 자동화 입구 카드 두 개만(2026-10-20 사용자 — 화면 가운데 크게, 카드 안에 법별 버튼).
         공지·결재·일정·직원 칸은 왼쪽 메뉴 각 화면에서. 폰은 카드를 위아래로 쌓아 위쪽에(app.css .home-only) -->
    <main class="main home-only">
        <div class="topline">
            <div>
                <h1 th:text="${currentUser != null ? currentUser.displayName + '님, 안녕하세요' : '안녕하세요'}">안녕하세요</h1>
            </div>
            <div class="num page-sub" th:text="${#temporals.format(#temporals.createNow(), 'yyyy.MM.dd (E)')}">오늘</div>
        </div>

        <div class="home-center">
            <div class="app-doors">
                <div class="app-door">
                    <!-- 설정 단추(2026-10-22 사용자 "설정 버튼을 만들자 너무 크게 말고") — 왼쪽 메뉴 '설정'과 같은 화면 -->
                    <a class="door-set" th:href="@{/report/settings.html}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>설정</span></a>
                    <div class="door-top">
                        <span class="door-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V9.5L10 6l7 3.5V15"/><path d="M7.5 15v-4h5v4"/></svg></span>
                        <span class="door-text"><b>보고서 자동화</b><small>결과보고서 작성 · PDF · 제출</small></span>
                    </div>
                    <!-- 둘째 줄 내진성능평가·결함조사(2026-10-22 사용자 "산안법 시특법 버튼 아래에 가로배치로"),
                         2026-10-30 사용자 "왼쪽 탭에 있는데 오른쪽에는 없는 거 버튼 — 탭 순서에 맞춰서" → 건축물관리점검(내진성능평가 다음), 결함조사는 셋째 줄 넓게 -->
                    <div class="door-stack">
                        <div class="door-btns n2">
                            <a class="door-btn" th:href="@{/report/dashboard.html}">산안법</a>
                            <a class="door-btn" th:href="@{/report/sitok.html}">시특법</a>
                        </div>
                        <div class="door-btns n2">
                            <a class="door-btn" th:href="@{/report/seismic.html}">내진성능평가</a>
                            <a class="door-btn" th:href="@{/report/blcm.html}">건축물관리점검</a>
                        </div>
                        <div class="door-btns">
                            <a class="door-btn" th:href="@{/report/defect-survey.html}">결함조사</a>
                        </div>
                    </div>
                </div>
                <div class="app-door">
                    <a class="door-set" th:href="@{/report/docs-settings.html}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>설정</span></a>
                    <div class="door-top">
                        <span class="door-ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.7h6.5L15 6.2v11.1H5z"/><path d="M11.5 2.7v3.5H15M7.5 10h5M7.5 13h5"/></svg></span>
                        <span class="door-text"><b>서류 자동화</b><small>용역 계약 · 착수계 · 완수계 · 실적</small></span>
                    </div>
                    <!-- 단추 넷 두 줄(2026-10-28 사용자 "내진성능평가 추가해서 버튼 4개 배치로") — 보고서 자동화 카드와 같은 모양,
                         2026-10-30 사용자 "탭 순서에 맞춰서" → 견적(맨 앞), 실적은 셋째 줄 넓게 -->
                    <div class="door-stack">
                        <div class="door-btns n2">
                            <a class="door-btn" th:href="@{/report/estimates.html}">견적</a>
                            <a class="door-btn" th:href="@{/report/docs.html}">산안법</a>
                        </div>
                        <div class="door-btns n2">
                            <a class="door-btn" th:href="@{/report/sitok-docs.html}">시특법</a>
                            <a class="door-btn" th:href="@{/report/seismic-docs.html}">내진성능평가</a>
                        </div>
                        <div class="door-btns">
                            <a class="door-btn" th:href="@{/report/docs-performance.html}">실적</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
