<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 폰 화면 폭에 맞추기 — 없으면 폰이 PC 폭(약 980px)으로 그려 통째로 축소해 보여 줘서 글자가 아주 작았음(2026-10-01) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <style>
        /* 로그인 화면은 크게(2026-10-01 사용자 "너무 작다" — PC·폰 둘 다). 입력 글자 16px 이상: 아이폰이 입력할 때 화면을 확대하지 않게 */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card {
            width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 18px; box-shadow: var(--shadow-card); padding: 48px 44px 40px; box-sizing: border-box;
        }
        .login-card img { height: 64px; display: block; margin: 0 auto 26px; }
        .login-card h1 { font-size: 24px; text-align: center; margin: 0 0 30px; }
        .login-card .field { margin-bottom: 20px; }
        .login-card .field label { font-size: 16px; margin-bottom: 8px; }
        .login-card .field input[type="text"], .login-card .field input[type="password"] { font-size: 17px; padding: 14px 16px; height: auto; }
        .login-card .field.checkbox-row input { width: 20px; height: 20px; }
        .login-card .field.checkbox-row label { font-size: 15.5px; }
        .login-msg { font-size: 15px; text-align: center; margin: 0 0 18px; padding: 10px; border-radius: 8px; }
        .login-msg.error { background: var(--crit-soft); color: var(--crit); }
        .login-msg.ok { background: var(--green-soft); color: var(--green); }
        .login-card .btn { width: 100%; justify-content: center; margin-top: 6px; padding: 15px 18px; font-size: 18px; border-radius: 10px; }
        @media (max-width: 520px) {
            body { padding: 16px; align-items: flex-start; padding-top: 12vh; }
            .login-card { padding: 36px 24px 30px; }
            .login-card img { height: 56px; }
            .login-card h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/img/logo.png" alt="한국미래안전" />
        <h1>한국미래안전 그룹웨어</h1>

        <p class="login-msg error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p class="login-msg ok" th:if="${param.logout}">로그아웃되었습니다.</p>
        <p class="login-msg ok" th:if="${param.renamed}">아이디가 변경되었습니다. 새 아이디로 다시 로그인해주세요.</p>

        <form id="loginForm" th:action="@{/login}" method="post" autocomplete="on">
            <div class="field">
                <label>아이디</label>
                <input type="text" id="username" name="username" autocomplete="username" required />
            </div>
            <div class="field">
                <label>비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required />
            </div>
            <div class="field checkbox-row">
                <input type="checkbox" id="rememberId" />
                <label for="rememberId">아이디 저장</label>
            </div>
            <button type="submit" class="btn btn-primary">로그인</button>
        </form>
    </div>

    <script>
        (function () {
            var COOKIE_NAME = 'gw_saved_username';

            function getCookie(name) {
                var match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
                return match ? decodeURIComponent(match[1]) : null;
            }

            function setCookie(name, value, days) {
                var expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
                document.cookie = name + '=' + encodeURIComponent(value) +
                    '; expires=' + expires + '; path=/; SameSite=Lax; Secure';
            }

            function deleteCookie(name) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
            }

            var usernameInput = document.getElementById('username');
            var rememberCheckbox = document.getElementById('rememberId');
            var savedUsername = getCookie(COOKIE_NAME);

            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberCheckbox.checked = true;
            }

            document.getElementById('loginForm').addEventListener('submit', function () {
                if (rememberCheckbox.checked) {
                    setCookie(COOKIE_NAME, usernameInput.value, 180);
                } else {
                    deleteCookie(COOKIE_NAME);
                }
            });
        })();
    </script>
</body>
</html>
