<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>급여 관리 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('admin')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/admin}">관리자 메뉴</a><span class="sep">/</span><span>급여 관리</span></div>
        <div class="topline">
            <h1>급여 관리</h1>
            <a class="btn btn-primary" th:href="@{/admin/payroll/new}">+ 급여 등록</a>
        </div>

        <div class="panel">
            <div class="panel-body" style="padding:0;">
                <table class="plain">
                    <thead>
                    <tr><th>귀속월</th><th>직원</th><th>부서</th><th>실수령액</th><th>관리</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${records}">
                        <td class="num" th:text="${r.payYear} + '년 ' + ${r.payMonth} + '월'">2026년 9월</td>
                        <td th:text="${r.employee.name}">이름</td>
                        <td th:text="${r.employee.department}">부서</td>
                        <td class="num" th:text="${#numbers.formatDecimal(r.netPay, 1, 'COMMA', 0, 'POINT')} + '원'">0원</td>
                        <td>
                            <a class="btn btn-ghost btn-sm" th:href="@{/admin/payroll/{id}/edit(id=${r.id})}">수정</a>
                            <form class="inline" th:action="@{/admin/payroll/{id}/delete(id=${r.id})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-note" style="padding:16px 18px;" th:if="${#lists.isEmpty(records)}">등록된 급여 내역이 없습니다.</div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
