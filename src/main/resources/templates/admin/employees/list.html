<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>직원정보 관리 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('admin')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/admin}">관리자 메뉴</a><span class="sep">/</span><span>직원정보 관리</span></div>
        <div class="topline">
            <h1>직원정보 관리</h1>
            <a class="btn btn-primary" th:href="@{/admin/employees/new}">+ 직원 추가</a>
        </div>

        <div class="panel">
            <div class="panel-body" style="padding:0;">
                <table class="plain">
                    <thead>
                    <tr><th>이름</th><th>부서</th><th>직급</th><th>연락처</th><th>이메일</th><th>관리</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="e : ${employees}">
                        <td th:text="${e.name}">이름</td>
                        <td th:text="${e.department}">부서</td>
                        <td th:text="${e.position}">직급</td>
                        <td th:text="${e.phone}">연락처</td>
                        <td th:text="${e.email}">이메일</td>
                        <td>
                            <a class="btn btn-ghost btn-sm" th:href="@{/admin/employees/{id}/edit(id=${e.id})}">수정</a>
                            <form class="inline" th:action="@{/admin/employees/{id}/delete(id=${e.id})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
