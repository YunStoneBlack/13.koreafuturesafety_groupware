<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 입력 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('admin')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/admin}">관리자 메뉴</a><span class="sep">/</span><a th:href="@{/admin/users}">계정 관리</a><span class="sep">/</span><span th:text="${userId} != null ? '수정' : '추가'">추가</span></div>
        <h1 th:text="${userId} != null ? '계정 수정' : '계정 추가'">계정 추가</h1>

        <p th:if="${error}" style="color: var(--crit); font-weight: 500;" th:text="${error}">에러</p>

        <form class="form-card" th:action="${userId} != null ? @{/admin/users/{id}(id=${userId})} : @{/admin/users}"
              th:object="${form}" method="post">
            <div class="field">
                <label>아이디</label>
                <input type="text" th:field="*{username}" required />
                <div class="hint" th:if="${userId} != null">변경하면 본인 계정 기준 다시 로그인해야 합니다.</div>
            </div>
            <div class="field">
                <label>비밀번호</label>
                <input type="password" th:field="*{password}" th:required="${userId} == null" />
                <div class="hint" th:if="${userId} != null">변경하지 않으려면 비워두세요.</div>
            </div>
            <div class="field">
                <label>이름</label>
                <input type="text" th:field="*{displayName}" required />
            </div>
            <div class="field">
                <label>권한</label>
                <select th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                </select>
            </div>
            <div class="field">
                <label>연결된 직원 (선택)</label>
                <select th:field="*{employeeId}">
                    <option value="">- 선택 안함 -</option>
                    <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name} + ' (' + ${emp.department} + ')'">직원</option>
                </select>
            </div>
            <div class="field checkbox-row">
                <input type="checkbox" th:field="*{enabled}" id="enabled" />
                <label for="enabled">사용 가능</label>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">저장</button>
                <a class="btn btn-ghost" th:href="@{/admin/users}">취소</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
