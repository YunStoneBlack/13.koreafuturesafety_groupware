<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 관리 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('admin')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/admin}">관리자 메뉴</a><span class="sep">/</span><span>계정 관리</span></div>
        <div class="topline">
            <h1>계정 관리</h1>
            <a class="btn btn-primary" th:href="@{/admin/users/new}">+ 계정 추가</a>
        </div>

        <div class="panel">
            <div class="panel-body" style="padding:0;">
                <table class="plain">
                    <thead>
                    <tr><th>아이디</th><th>이름</th><th>연결된 직원</th><th>권한</th><th>사용여부</th><th>관리</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="num" th:text="${u.username}">아이디</td>
                        <td th:text="${u.displayName}">이름</td>
                        <td th:text="${u.employee != null ? u.employee.name : '-'}">-</td>
                        <td th:text="${u.role}">ROLE</td>
                        <td th:text="${u.enabled ? '사용' : '중지'}">사용</td>
                        <td>
                            <a class="btn btn-ghost btn-sm" th:href="@{/admin/users/{id}/edit(id=${u.id})}">수정</a>
                            <form class="inline" th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                  onsubmit="return confirm('삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
