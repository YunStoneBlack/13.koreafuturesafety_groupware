<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글</title>
</head>
<body>
    <p><a th:href="@{/}">홈으로</a> | <a th:href="@{/board}">목록으로</a></p>
    <h1 th:text="${post.title}">제목</h1>
    <p>
        <span th:text="${post.author.displayName}">작성자</span> ·
        <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span> ·
        조회 <span th:text="${post.viewCount}">0</span>
    </p>
    <div th:text="${post.content}" style="white-space: pre-wrap;">
        내용
    </div>

    <div th:if="${canManage}">
        <a th:href="@{/board/{id}/edit(id=${post.id})}">수정</a>
        <form th:action="@{/board/{id}/delete(id=${post.id})}" method="post" style="display:inline"
              onsubmit="return confirm('삭제하시겠습니까?');">
            <button type="submit">삭제</button>
        </form>
    </div>
</body>
</html>
