<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">게시글</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('board')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/board}">공지사항</a><span class="sep">/</span><span th:text="${post.title}">제목</span></div>

        <h1 th:text="${post.title}">제목</h1>
        <p class="meta-line">
            <b th:text="${post.author.displayName}">작성자</b>
            <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">작성일</span>
            <span th:text="'조회 ' + ${post.viewCount}">조회 0</span>
        </p>

        <div class="panel">
            <div class="panel-body content-body" th:text="${post.content}">내용</div>
        </div>

        <div class="btn-row" th:if="${canManage}">
            <a class="btn btn-ghost" th:href="@{/board/{id}/edit(id=${post.id})}">수정</a>
            <form class="inline" th:action="@{/board/{id}/delete(id=${post.id})}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');">
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
