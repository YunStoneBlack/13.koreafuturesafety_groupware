<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('board')}"></div>

    <main class="main">
        <div class="topline">
            <div>
                <h1>공지사항</h1>
                <p class="page-sub">사내 공지 및 게시판입니다.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/board/new}">+ 글쓰기</a>
        </div>

        <div class="panel">
            <div class="rows">
                <a class="row" th:each="p : ${posts}" th:href="@{/board/{id}(id=${p.id})}">
                    <span class="title" th:text="${p.title}">제목</span>
                    <span class="meta" th:text="${p.author.displayName}">작성자</span>
                    <span class="meta num" th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}">작성일</span>
                    <span class="meta num" th:text="'조회 ' + ${p.viewCount}">조회 0</span>
                </a>
                <div class="empty-note" th:if="${#lists.isEmpty(posts)}">등록된 게시글이 없습니다. 첫 글을 작성해보세요.</div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
