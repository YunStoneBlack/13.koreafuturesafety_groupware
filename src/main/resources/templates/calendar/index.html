<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}" />
    <title>일정공유 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script th:src="@{/js/calendar-widget.js}"></script>
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('calendar')}"></div>

    <main class="main">
        <div class="topline">
            <div>
                <h1>일정공유</h1>
                <p class="page-sub">전 직원이 함께 보는 캘린더입니다. 날짜를 클릭하면 그날의 일정을 볼 수 있습니다.</p>
            </div>
            <button type="button" class="btn btn-primary" id="topAddEventBtn"
                    th:attr="data-today=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">+ 일정 추가</button>
        </div>

        <div class="cal-embed">
            <div id="calendar"></div>
        </div>

        <div th:replace="~{fragments/calendar-modals :: modals}"></div>

        <script>
            initGroupwareCalendar('calendar', { height: 'auto' });
            document.getElementById('topAddEventBtn').addEventListener('click', function () {
                if (window.groupwareCalendar) {
                    window.groupwareCalendar.openNewEventModal(this.getAttribute('data-today'));
                }
            });
        </script>
    </main>
</div>
</body>
</html>
