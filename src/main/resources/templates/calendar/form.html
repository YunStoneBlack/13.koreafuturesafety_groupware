<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일정 입력 - 한국미래안전 그룹웨어</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="app">
    <div th:replace="~{fragments/appshell :: sidebar('calendar')}"></div>

    <main class="main">
        <div class="crumb"><a th:href="@{/calendar}">일정공유</a><span class="sep">/</span><span th:text="${form.id} != null ? '수정' : '추가'">추가</span></div>
        <h1 th:text="${form.id} != null ? '일정 수정' : '일정 추가'">일정 추가</h1>

        <form class="form-card" th:action="${form.id} != null ? @{/calendar/{id}(id=${form.id})} : @{/calendar}"
              th:object="${form}" method="post">
            <div class="field">
                <label>제목</label>
                <input type="text" th:field="*{title}" required />
            </div>
            <div class="field">
                <label>설명</label>
                <textarea th:field="*{description}" rows="4"></textarea>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>시작 날짜</label>
                    <input type="date" th:field="*{startDate}" required />
                </div>
                <div class="field">
                    <label>시작 시간</label>
                    <input type="time" th:field="*{startTime}" lang="en-GB" required />
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>종료 날짜</label>
                    <input type="date" th:field="*{endDate}" required />
                </div>
                <div class="field">
                    <label>종료 시간</label>
                    <input type="time" th:field="*{endTime}" lang="en-GB" required />
                </div>
            </div>
            <div class="hint" style="margin: -6px 0 16px;">시간 칸을 클릭한 뒤 숫자를 직접 입력할 수도 있습니다 (예: 0930). 00:00~23:59 사이 24시간 표기입니다.</div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">저장</button>
                <a class="btn btn-ghost" th:href="@{/calendar}">취소</a>
            </div>
        </form>

        <form th:if="${form.id} != null" th:action="@{/calendar/{id}/delete(id=${form.id})}" method="post"
              onsubmit="return confirm('삭제하시겠습니까?');" style="margin-top:14px;">
            <button type="submit" class="btn btn-danger">삭제</button>
        </form>
    </main>
</div>
</body>
</html>
