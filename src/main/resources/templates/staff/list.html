<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>직원정보 - 한국미래안전 그룹웨어</title>
</head>
<body>
    <div th:replace="~{fragments/logo :: logo}"></div>
    <p><a th:href="@{/}">홈으로</a></p>
    <h1>직원정보 (조직도)</h1>

    <table border="1" cellpadding="6">
        <thead>
        <tr>
            <th>이름</th>
            <th>부서</th>
            <th>직급</th>
            <th>연락처</th>
            <th>이메일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${employees}">
            <td th:text="${e.name}">이름</td>
            <td th:text="${e.department}">부서</td>
            <td th:text="${e.position}">직급</td>
            <td th:text="${e.phone}">연락처</td>
            <td th:text="${e.email}">이메일</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
